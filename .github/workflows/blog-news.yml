name: Daily News Blog
# Simplified: fetch news + generate articles + post to site (no video/upload)

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser requests groq imageio-ffmpeg python-dotenv
        # Note: imageio-ffmpeg provides binary; ffmpeg-python is Python wrapper
      - name: Generate blog articles
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
        run: |
          # Create content/news/ (if missing from repo clone)
          mkdir -p content/news site
          # Run the writer (outputs .md + .json feed)
          python src/write_blog_news.py
          # Show results
          echo "=== ARTICLES ==="
          ls -la content/news/*.md 2>/dev/null || echo "No .md files yet"
          echo "=== JSON FEED ==="
          cat site/news-feed.json 2>/dev/null || echo "No feed yet"
      - name: Show site structure
        run: echo "Site ready at site/index.html; policy pages at site/privacy.html, site/terms.html, site/cookies.html"
