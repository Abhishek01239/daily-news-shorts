name: Daily News Shorts

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      category:
        description: 'News category to process (leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: daily-news-shorts
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate news videos
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_JSON_DAILYNEWS: ${{ secrets.YOUTUBE_TOKEN_JSON_DAILYNEWS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python src/main.py --category "${{ github.event.inputs.category }}"

      - name: Commit and push registry updates
        run: |
          git config user.name "Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .marketing || true
          git add data/state.json || true
          git diff --cached --quiet || {
            git commit -m "chore: update state and marketing registry [skip ci]" || true
            git push || true
          }